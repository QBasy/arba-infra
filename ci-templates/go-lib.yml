# Общий CI-шаблон Go-библиотек Arba (kit, contracts): образ не собирается, версия = git-тег vX.Y.Z.
# Подключение в репозитории библиотеки:
#
#   include:
#     - project: arba/infra
#       ref: main
#       file: ci-templates/go-lib.yml
#   variables:
#     GO_VERSION: "1.27"
#     # GEN_CMD: "make generate"    # необязательно: проверка, что сгенерированный код актуален
#
# Правила: docs/rules/ci.md, versions.md

stages: [verify, test, release]

variables:
  GO_VERSION: "1.27"          # = директива go в go.mod
  GEN_CMD: ""                 # команда генерации кода; если задана, CI проверяет, что после неё нет диффа
  GITLAB_HOST: gitlab.arba.kz
  GOINSECURE: "*.arba.kz"
  GOPRIVATE: "*.arba.kz"
  GOFLAGS: "-mod=readonly"
  CGO_ENABLED: "1"            # -race требует cgo
  GOCACHE: $CI_PROJECT_DIR/.cache/go-build
  GOMODCACHE: $CI_PROJECT_DIR/.cache/go-mod
  GOLANGCI_IMAGE: golangci/golangci-lint:v2.14.0
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.28.0

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

.go:
  image: golang:${GO_VERSION}-alpine
  before_script:
    - apk add --no-cache git make bash gcc musl-dev   # gcc нужен для go test -race (cgo)
    - git config --global url."http://gitlab-ci-token:${CI_JOB_TOKEN}@${GITLAB_HOST}/".insteadOf "http://${GITLAB_HOST}/"
  cache:
    key: go-$CI_PROJECT_NAME
    paths: [.cache/]

# ───────────── verify ─────────────
go-versions:
  stage: verify
  extends: [.go]
  script:
    - GOMOD=$(awk '/^go /{print $2}' go.mod | cut -d. -f1,2)
    - echo "go.mod=$GOMOD  GO_VERSION=$GO_VERSION"
    - '[ "$GOMOD" = "$GO_VERSION" ] || { echo "go.mod ($GOMOD) != GO_VERSION ($GO_VERSION)"; exit 1; }'
    - go mod tidy
    - git diff --exit-code go.mod go.sum

lint:
  stage: verify
  image: $GOLANGCI_IMAGE
  before_script:
    - git config --global url."http://gitlab-ci-token:${CI_JOB_TOKEN}@${GITLAB_HOST}/".insteadOf "http://${GITLAB_HOST}/"
  script:
    - golangci-lint run ./...
  cache:
    key: go-$CI_PROJECT_NAME
    paths: [.cache/]

gitleaks:
  stage: verify
  image: { name: $GITLEAKS_IMAGE, entrypoint: [""] }
  script:
    - gitleaks detect --no-git --source . --no-banner --redact

generated-code:
  stage: verify
  extends: [.go]
  rules:
    - if: $GEN_CMD
  script:
    - sh -c "$GEN_CMD"
    - git diff --exit-code

# ───────────── test ─────────────
unit:
  stage: test
  extends: [.go]
  script:
    - go test -race -covermode=atomic -coverprofile=cover.out ./...
    - go tool cover -func=cover.out | tail -n 1
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'

# ───────────── release ─────────────
# Версия библиотеки = git-тег. Go требует префикс v и семантическую версию: v0.2.0, v1.4.2.
release-tag:
  stage: release
  image: alpine:3.21
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - |
      case "$CI_COMMIT_TAG" in
        v[0-9]*.[0-9]*.[0-9]*) echo "ok: $CI_COMMIT_TAG" ;;
        *) echo "тег библиотеки должен быть вида vMAJOR.MINOR.PATCH (например v0.2.0), получен: $CI_COMMIT_TAG"; exit 1 ;;
      esac
