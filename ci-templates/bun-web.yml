# Общий CI-шаблон фронтенда на Bun (SvelteKit + adapter-static + nginx). Подключение:
#
#   include:
#     - project: arba/infra
#       ref: main
#       file: ci-templates/bun-web.yml
#   variables:
#     SERVICE: documentation
#
# Правила: docs/rules/ci.md, build.md, versions.md

stages: [verify, build, image, deploy, release]

variables:
  SERVICE: ""
  BUN_IMAGE: oven/bun:1.4-alpine
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.28.0
  HELM_IMAGE: alpine/helm:3.16.4
  KANIKO_IMAGE: gcr.io/kaniko-project/executor:v1.23.2-debug
  CRANE_IMAGE: gcr.io/go-containerregistry/crane:debug
  REGISTRY: registry.arba.kz
  GITLAB_HOST: gitlab.arba.kz
  GITOPS_REPO: argocd/argocd-dev
  IMAGE: $REGISTRY/$CI_PROJECT_PATH
  MIRROR_DOCKER: mirror-docker.registry.svc.cluster.local:5000
  BUN_INSTALL_CACHE_DIR: $CI_PROJECT_DIR/.cache/bun

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

.bun:
  image: $BUN_IMAGE
  cache:
    key:
      files: [bun.lock]
    paths: [.cache/bun]
  before_script:
    - bun install --frozen-lockfile

.not-tag:
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success

# ───────────── verify ─────────────
lint:
  stage: verify
  extends: [.bun, .not-tag]
  script:
    - bun run lint

check:
  stage: verify
  extends: [.bun, .not-tag]
  script:
    - bun run check

helm-lint:
  stage: verify
  image: { name: $HELM_IMAGE, entrypoint: [""] }
  extends: [.not-tag]
  script:
    - helm lint .helm --set image.tag=0.0.0
    - helm template "$SERVICE" .helm --set image.tag=0.0.0 > /dev/null

gitleaks:
  stage: verify
  image: { name: $GITLEAKS_IMAGE, entrypoint: [""] }
  extends: [.not-tag]
  script:
    - gitleaks detect --source . --no-banner --redact

# ───────────── build ─────────────
build-site:
  stage: build
  extends: [.bun]       # и по тегу: сайт собирается заново на каждый релиз (тянет свежие доки)
  script:
    - test -n "$GITLAB_TOKEN" || test -n "$CI_JOB_TOKEN"
    - bun run build
  artifacts:
    paths: [build/]
    expire_in: 1 day

# ───────────── image (только по тегу; тег = версия образа) ─────────────
build-image:
  stage: image
  image: { name: $KANIKO_IMAGE, entrypoint: [""] }
  needs: [build-site]
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - TAG="$CI_COMMIT_TAG"
    - /kaniko/executor
      --context "$CI_PROJECT_DIR" --dockerfile "$CI_PROJECT_DIR/Dockerfile"
      --destination "$IMAGE:$TAG"
      --digest-file /tmp/digest
      --label org.opencontainers.image.source="$CI_PROJECT_URL"
      --label org.opencontainers.image.revision="$CI_COMMIT_SHA"
      --label org.opencontainers.image.version="$TAG"
      --insecure --skip-tls-verify
      --registry-mirror="$MIRROR_DOCKER" --insecure-registry="$MIRROR_DOCKER"
    - echo "IMAGE_TAG=$TAG" > build.env
    - echo "IMAGE_DIGEST=$(cat /tmp/digest)" >> build.env
    - cat build.env
  artifacts:
    reports: { dotenv: build.env }

# ───────────── deploy в dev (тег -> коммит в argocd/argocd-dev, дальше Argo CD) ─────────────
deploy-dev:
  stage: deploy
  image: alpine:3.21
  needs: [build-image]
  rules:
    - if: $CI_COMMIT_TAG
  resource_group: gitops-dev
  script:
    - apk add --no-cache git
    - |
      if [ -z "$GITOPS_PUSH_TOKEN" ]; then echo "нет переменной GITOPS_PUSH_TOKEN (группа arba)"; exit 1; fi
      git clone --depth 1 "http://gitops-bot:${GITOPS_PUSH_TOKEN}@${GITLAB_HOST}/${GITOPS_REPO}.git" /tmp/gitops
      if [ ! -f "/tmp/gitops/dev/${SERVICE}.yml" ]; then
        TIER=platform
        case "$CI_PROJECT_PATH" in */engines/*) TIER=engine ;; esac
        sh /tmp/gitops/scripts/new-service.sh "$SERVICE" "http://${GITLAB_HOST}/${CI_PROJECT_PATH}.git" "${REGISTRY}/${CI_PROJECT_PATH}" "$TIER" /tmp/gitops
      fi
      sh /tmp/gitops/scripts/bump.sh "/tmp/gitops/dev/${SERVICE}.yml" "$CI_COMMIT_SHA" "$IMAGE_TAG" "$IMAGE_DIGEST"
      cd /tmp/gitops
      git add -A
      git -c user.name=gitops-bot -c user.email=gitops-bot@arba.kz commit -m "deploy(dev): ${SERVICE} ${IMAGE_TAG}"
      git push origin HEAD:main

# ───────────── release (helm-чарт; только для семантических тегов 1.2.3 / v1.2.3) ─────────────
release-chart:
  stage: release
  image: { name: $HELM_IMAGE, entrypoint: [""] }
  needs: [build-image]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+$/
  script:
    - VERSION=${CI_COMMIT_TAG#v}
    - helm package .helm --version "$VERSION" --app-version "$VERSION"
    - helm push ./*-"$VERSION".tgz "oci://$REGISTRY/arba/charts" --plain-http   # имя файла = name из Chart.yaml
