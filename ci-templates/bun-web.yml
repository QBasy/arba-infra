# Общий CI-шаблон фронтенда на Bun (SvelteKit + adapter-static + nginx). Подключение:
#
#   include:
#     - project: arba/infra
#       ref: main
#       file: ci-templates/bun-web.yml
#   variables:
#     SERVICE: documentation
#
# Правила: docs/rules/ci.md, build.md, versions.md

stages: [verify, build, image, deploy, release]

variables:
  SERVICE: ""
  IMAGE_TAG_SUFFIX: ""        # сборка зависит от внешних данных (портал документации) -> "-p${CI_PIPELINE_IID}"
  BUN_IMAGE: oven/bun:1.4-alpine
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.28.0
  HELM_IMAGE: alpine/helm:3.16.4
  KANIKO_IMAGE: gcr.io/kaniko-project/executor:v1.23.2-debug
  CRANE_IMAGE: gcr.io/go-containerregistry/crane:debug
  REGISTRY: registry.arba.kz
  GITLAB_HOST: gitlab.arba.kz
  INFRA_REPO: arba/infra
  IMAGE: $REGISTRY/$CI_PROJECT_PATH
  MIRROR_DOCKER: mirror-docker.registry.svc.cluster.local:5000
  BUN_INSTALL_CACHE_DIR: $CI_PROJECT_DIR/.cache/bun

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

.bun:
  image: $BUN_IMAGE
  cache:
    key:
      files: [bun.lock]
    paths: [.cache/bun]
  before_script:
    - bun install --frozen-lockfile

.not-tag:
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success

# ───────────── verify ─────────────
lint:
  stage: verify
  extends: [.bun, .not-tag]
  script:
    - bun run lint

check:
  stage: verify
  extends: [.bun, .not-tag]
  script:
    - bun run check

helm-lint:
  stage: verify
  image: { name: $HELM_IMAGE, entrypoint: [""] }
  extends: [.not-tag]
  script:
    - helm lint .helm --set image.tag=0.0.0
    - helm template "$SERVICE" .helm --set image.tag=0.0.0 > /dev/null

gitleaks:
  stage: verify
  image: { name: $GITLEAKS_IMAGE, entrypoint: [""] }
  extends: [.not-tag]
  script:
    - gitleaks detect --source . --no-banner --redact

# ───────────── build ─────────────
build-site:
  stage: build
  extends: [.bun, .not-tag]
  script:
    - test -n "$GITLAB_TOKEN" || test -n "$CI_JOB_TOKEN"
    - bun run build
  artifacts:
    paths: [build/]
    expire_in: 1 day

# ───────────── image (только main) ─────────────
build-image:
  stage: image
  image: { name: $KANIKO_IMAGE, entrypoint: [""] }
  needs: [build-site]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - TAG="sha-${CI_COMMIT_SHORT_SHA}${IMAGE_TAG_SUFFIX}"
    - /kaniko/executor
      --context "$CI_PROJECT_DIR" --dockerfile "$CI_PROJECT_DIR/Dockerfile"
      --destination "$IMAGE:$TAG"
      --digest-file /tmp/digest
      --label org.opencontainers.image.source="$CI_PROJECT_URL"
      --label org.opencontainers.image.revision="$CI_COMMIT_SHA"
      --label org.opencontainers.image.version="$TAG"
      --insecure --skip-tls-verify
      --registry-mirror="$MIRROR_DOCKER" --insecure-registry="$MIRROR_DOCKER"
    - echo "IMAGE_TAG=$TAG" > build.env
    - echo "IMAGE_DIGEST=$(cat /tmp/digest)" >> build.env
    - cat build.env
  artifacts:
    reports: { dotenv: build.env }

# ───────────── deploy в dev (только main) ─────────────
deploy-dev:
  stage: deploy
  image: alpine:3.21
  needs: [build-image]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  resource_group: infra-dev
  script:
    - apk add --no-cache git curl bash python3 py3-yaml
    - git clone --depth 1 "http://infra-bot:${INFRA_PUSH_TOKEN}@${GITLAB_HOST}/${INFRA_REPO}.git" /tmp/infra
    - |
      /tmp/infra/scripts/bump-env.sh \
        --infra /tmp/infra --env dev --service "$SERVICE" \
        --repo "http://$GITLAB_HOST/$CI_PROJECT_PATH.git" \
        --revision "$CI_COMMIT_SHA" --tag "$IMAGE_TAG" --digest "$IMAGE_DIGEST" \
        --push

# ───────────── release (тег vX.Y.Z) ─────────────
release-image:
  stage: release
  image: { name: $CRANE_IMAGE, entrypoint: [""] }
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - VERSION=${CI_COMMIT_TAG#v}
    - SRC=$(crane ls --insecure "$IMAGE" | grep "^sha-${CI_COMMIT_SHORT_SHA}" | sort -V | tail -n 1)
    - test -n "$SRC" || { echo "no image built from this commit"; exit 1; }
    - DIGEST=$(crane digest --insecure "$IMAGE:$SRC")
    - echo "release $VERSION = $SRC = $DIGEST"
    - crane tag --insecure "$IMAGE@$DIGEST" "$VERSION"

release-chart:
  stage: release
  image: { name: $HELM_IMAGE, entrypoint: [""] }
  needs: [release-image]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - VERSION=${CI_COMMIT_TAG#v}
    - helm package .helm --version "$VERSION" --app-version "$VERSION"
    - helm push "$SERVICE-$VERSION.tgz" "oci://$REGISTRY/arba/charts" --plain-http
