# Общий CI-шаблон Go-сервиса Arba. Подключение в репозитории сервиса:
#
#   include:
#     - project: arba/infra
#       ref: main
#       file: ci-templates/go-engine.yml
#   variables:
#     GO_VERSION: "1.27"
#     SERVICE: origination
#
# Правила: docs/rules/ci.md, build.md, versions.md

stages: [verify, test, build, scan, deploy, release]

variables:
  # --- задаётся в проекте ---
  GO_VERSION: "1.27"          # = директива go в go.mod = .tool-versions
  SERVICE: ""                 # имя сервиса = имя папки в envs/dev/
  COVERAGE_MIN: "75"
  DOMAIN_COVERAGE_MIN: "90"
  # --- общее ---
  REGISTRY: registry.arba.kz
  GITLAB_HOST: gitlab.arba.kz
  INFRA_REPO: arba/infra
  IMAGE: $REGISTRY/$CI_PROJECT_PATH
  GOINSECURE: "*.arba.kz"
  GOPRIVATE: "*.arba.kz"
  GOFLAGS: "-mod=readonly"
  GOCACHE: $CI_PROJECT_DIR/.cache/go-build
  GOMODCACHE: $CI_PROJECT_DIR/.cache/go-mod
  # версии инструментов: при первом запуске проверьте, что теги существуют, и поправьте здесь
  GOLANGCI_IMAGE: golangci/golangci-lint:v2.5.0
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.28.0
  HELM_IMAGE: alpine/helm:3.16.4
  KANIKO_IMAGE: gcr.io/kaniko-project/executor:v1.23.2-debug
  CRANE_IMAGE: gcr.io/go-containerregistry/crane:debug
  TRIVY_IMAGE: aquasec/trivy:0.65.0
  MIRROR_DOCKER: mirror-docker.registry.svc.cluster.local:5000

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

.go:
  image: golang:${GO_VERSION}-alpine
  before_script:
    - apk add --no-cache git make bash
    - git config --global url."http://gitlab-ci-token:${CI_JOB_TOKEN}@${GITLAB_HOST}/".insteadOf "http://${GITLAB_HOST}/"
  cache:
    key: go-$CI_PROJECT_NAME
    paths: [.cache/]

.not-tag:
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success

# ───────────── verify ─────────────
go-versions:
  stage: verify
  extends: [.go, .not-tag]
  script:
    - GOMOD=$(awk '/^go /{print $2}' go.mod | cut -d. -f1,2)
    - TOOL=$(awk '/^golang /{print $2}' .tool-versions | cut -d. -f1,2)
    - echo "go.mod=$GOMOD  .tool-versions=$TOOL  GO_VERSION=$GO_VERSION"
    - '[ "$GOMOD" = "$GO_VERSION" ] || { echo "go.mod ($GOMOD) != GO_VERSION ($GO_VERSION)"; exit 1; }'
    - '[ -z "$TOOL" ] || [ "$TOOL" = "$GO_VERSION" ] || { echo ".tool-versions ($TOOL) != GO_VERSION"; exit 1; }'
    - go mod tidy
    - git diff --exit-code go.mod go.sum

lint:
  stage: verify
  image: $GOLANGCI_IMAGE
  extends: [.not-tag]
  before_script:
    - git config --global url."http://gitlab-ci-token:${CI_JOB_TOKEN}@${GITLAB_HOST}/".insteadOf "http://${GITLAB_HOST}/"
  script:
    - golangci-lint run ./...
  cache:
    key: go-$CI_PROJECT_NAME
    paths: [.cache/]

arch-lint:
  stage: verify
  extends: [.go, .not-tag]
  script:
    - go run github.com/fe3dback/go-arch-lint@latest check --project-path .   # закрепите версию через ADR
  allow_failure: false

helm-lint:
  stage: verify
  image: { name: $HELM_IMAGE, entrypoint: [""] }
  extends: [.not-tag]
  script:
    - helm lint .helm --set image.tag=0.0.0
    - helm template "$SERVICE" .helm --set image.tag=0.0.0 --set worker.enabled=true --set migrate.enabled=true > /dev/null

gitleaks:
  stage: verify
  image: { name: $GITLEAKS_IMAGE, entrypoint: [""] }
  extends: [.not-tag]
  script:
    - gitleaks detect --source . --no-banner --redact

# ───────────── test ─────────────
unit:
  stage: test
  extends: [.go, .not-tag]
  script:
    - go test -race -covermode=atomic -coverprofile=cover.out ./...
    - go tool cover -func=cover.out | tail -n 1
    - |
      TOTAL=$(go tool cover -func=cover.out | awk '/^total:/{gsub("%","",$3); print $3}')
      awk -v t="$TOTAL" -v m="$COVERAGE_MIN" 'BEGIN{ if (t+0 < m+0) { print "coverage " t "% < " m "%"; exit 1 } }'
    - |
      if [ -d internal/domain ]; then
        go test -covermode=atomic -coverprofile=domain.out ./internal/domain/... && \
        D=$(go tool cover -func=domain.out | awk '/^total:/{gsub("%","",$3); print $3}') && \
        awk -v t="$D" -v m="$DOMAIN_COVERAGE_MIN" 'BEGIN{ if (t+0 < m+0) { print "domain coverage " t "% < " m "%"; exit 1 } }'
      fi
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'

integration:
  stage: test
  extends: [.go, .not-tag]
  services:
    - name: postgres:17-alpine
      alias: postgres
  variables:
    POSTGRES_USER: test
    POSTGRES_PASSWORD: test
    POSTGRES_DB: test
    TEST_DATABASE_URL: postgres://test:test@postgres:5432/test?sslmode=disable
  script:
    - make test-integration

# ───────────── build (только main) ─────────────
build-image:
  stage: build
  image: { name: $KANIKO_IMAGE, entrypoint: [""] }
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - MODULE=$(awk '/^module /{print $2}' go.mod)
    - TAG="sha-${CI_COMMIT_SHORT_SHA}"
    - /kaniko/executor
      --context "$CI_PROJECT_DIR" --dockerfile "$CI_PROJECT_DIR/Dockerfile"
      --destination "$IMAGE:$TAG"
      --digest-file /tmp/digest
      --cache=true --cache-repo="$REGISTRY/arba/cache/$CI_PROJECT_NAME"
      --build-arg GO_VERSION="$GO_VERSION" --build-arg VERSION="$TAG" --build-arg COMMIT="$CI_COMMIT_SHA"
      --build-arg MODULE="$MODULE" --build-arg GIT_TOKEN="$CI_JOB_TOKEN"
      --label org.opencontainers.image.source="http://$GITLAB_HOST/$CI_PROJECT_PATH"
      --label org.opencontainers.image.revision="$CI_COMMIT_SHA"
      --label org.opencontainers.image.version="$TAG"
      --insecure --skip-tls-verify
      --registry-mirror="$MIRROR_DOCKER" --insecure-registry="$MIRROR_DOCKER"
    - echo "IMAGE_TAG=$TAG" > build.env
    - echo "IMAGE_DIGEST=$(cat /tmp/digest)" >> build.env
    - cat build.env
  artifacts:
    reports: { dotenv: build.env }

# ───────────── scan ─────────────
govulncheck:
  stage: scan
  extends: [.go]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - go install golang.org/x/vuln/cmd/govulncheck@latest
    - govulncheck ./...
  allow_failure: true       # уберите, когда появится локальное зеркало баз

trivy-image:
  stage: scan
  image: { name: $TRIVY_IMAGE, entrypoint: [""] }
  needs: [build-image]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    TRIVY_INSECURE: "true"
    TRIVY_NON_SSL: "true"
  script:
    - trivy image --severity HIGH,CRITICAL --exit-code 1 --format table "$IMAGE@$IMAGE_DIGEST"
  allow_failure: true       # то же: база уязвимостей скачивается из интернета

# ───────────── deploy в dev (только main) ─────────────
deploy-dev:
  stage: deploy
  image: alpine:3.21
  needs: [build-image]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  resource_group: infra-dev
  script:
    - apk add --no-cache git curl bash python3 py3-yaml
    - git clone --depth 1 "http://infra-bot:${INFRA_PUSH_TOKEN}@${GITLAB_HOST}/${INFRA_REPO}.git" /tmp/infra
    - |
      /tmp/infra/scripts/bump-env.sh \
        --infra /tmp/infra --env dev --service "$SERVICE" \
        --repo "http://$GITLAB_HOST/$CI_PROJECT_PATH.git" \
        --revision "$CI_COMMIT_SHA" --tag "$IMAGE_TAG" --digest "$IMAGE_DIGEST" \
        --push

# ───────────── release (тег vX.Y.Z) ─────────────
release-image:
  stage: release
  image: { name: $CRANE_IMAGE, entrypoint: [""] }
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - VERSION=${CI_COMMIT_TAG#v}
    - DIGEST=$(crane digest --insecure "$IMAGE:sha-${CI_COMMIT_SHORT_SHA}")
    - echo "release $VERSION = $DIGEST"
    - crane tag --insecure "$IMAGE@$DIGEST" "$VERSION"
    - echo "$VERSION $DIGEST" > release.txt
  artifacts:
    paths: [release.txt]

release-chart:
  stage: release
  image: { name: $HELM_IMAGE, entrypoint: [""] }
  needs: [release-image]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - VERSION=${CI_COMMIT_TAG#v}
    - helm package .helm --version "$VERSION" --app-version "$VERSION"
    - helm push "$SERVICE-$VERSION.tgz" "oci://$REGISTRY/arba/charts" --plain-http
