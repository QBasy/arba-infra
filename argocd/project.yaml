apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: arba
  namespace: argocd
spec:
  description: Сервисы Arba
  sourceRepos:
    - http://gitlab.arba.kz/arba/*
  destinations:
    - namespace: dev
      server: https://kubernetes.default.svc
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - { group: "*", kind: "*" }
